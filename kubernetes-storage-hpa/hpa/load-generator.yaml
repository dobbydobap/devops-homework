# Sends requests to hpa-demo-service in a tight loop. 4 replicas so the
# nginx pods actually go past 50% of their 100m CPU request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 4
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O- http://hpa-demo-service >/dev/null; done"]
