global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus monitoring itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # the TaskBoard FastAPI backend (session 21 app, running under docker compose).
  # Prometheus joins that compose network, so it reaches the backend by service name.
  # The backend exposes /metrics via prometheus-fastapi-instrumentator.
  - job_name: taskboard-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: taskboard
