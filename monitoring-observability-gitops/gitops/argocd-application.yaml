# Applied once by hand (kubectl apply -f). It lives outside app/ on purpose,
# so Argo CD doesn't try to manage its own Application definition.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-mini
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/dobbydobap/devops-homework.git
    targetRevision: main
    path: monitoring-observability-gitops/gitops/app

  destination:
    server: https://kubernetes.default.svc
    namespace: session20

  syncPolicy:
    automated:
      prune: true      # delete things that were removed from Git
      selfHeal: true   # undo manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
